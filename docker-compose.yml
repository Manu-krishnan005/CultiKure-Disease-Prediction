version: "3.8"

# ────────────────────────────────────────────────────────────
# CultiKure Docker Compose
# Run with:  docker-compose up --build
# GPU mode:  docker-compose --profile gpu up --build
# ────────────────────────────────────────────────────────────

services:

  # ── NVIDIA Triton Inference Server ─────────────────────────
  triton:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    container_name: cultikure-triton
    restart: unless-stopped
    ports:
      - "8000:8000"   # HTTP REST API
      - "8001:8001"   # gRPC API
      - "8002:8002"   # Metrics (Prometheus)
    volumes:
      - ./model_repository:/models:ro
    command: >
      tritonserver
      --model-repository=/models
      --log-verbose=0
      --log-info=1
      --strict-model-config=false
      --grpc-infer-allocation-pool-size=16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cultikure-net

  # ── Flask Application ───────────────────────────────────────
  cultikure-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cultikure-flask
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - TRITON_URL=triton:8000
      - USE_TRITON=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      - uploads_data:/app/static/uploads
    depends_on:
      triton:
        condition: service_healthy
    networks:
      - cultikure-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ── Named volumes ───────────────────────────────────────────
volumes:
  uploads_data:
    driver: local

# ── Networks ────────────────────────────────────────────────
networks:
  cultikure-net:
    driver: bridge
